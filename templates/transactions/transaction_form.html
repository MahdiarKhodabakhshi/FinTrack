{% extends "base.html" %}
{% block title %}Add transaction — FinTrack{% endblock %}
{% block content %}
<!-- FT-16 (Saad): Unstyled add-transaction placeholder. -->
<h1>Add transaction</h1>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <p>{{ field.label_tag }} {{ field }} {{ field.errors }}</p>
  {% endfor %}
  <button type="submit">Save transaction</button>
</form>
{% endblock %}
