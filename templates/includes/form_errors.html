{# FT-12: Clearly announce Django's non-field errors without changing wording. #}
{% with errors=form.non_field_errors %}
  {% if errors %}
    <div class="alert alert-danger" role="alert">
      {% if errors|length == 1 %}
        <p class="mb-0">{{ errors.0 }}</p>
      {% else %}
        <ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
      {% endif %}
    </div>
  {% endif %}
{% endwith %}
